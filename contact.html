<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Wajad R. Basha</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background:
                linear-gradient(rgba(10, 7, 12, 0.65), rgba(10, 7, 12, 0.85)),
                url('castle.png');
            background-size: cover;
            background-position: center top;
            background-attachment: fixed;
            color: #f3e8d0;
            font-family: "Times New Roman", serif;
        }

        .page {
            max-width: 850px;
            margin: auto;
            padding: 80px 30px;
            text-align: center;
        }

        .content {
            background: rgba(15, 10, 18, 0.72);
            padding: 45px;
            border: 1px solid rgba(243, 232, 208, 0.25);
        }

        h1 {
            font-size: 48px;
            font-weight: normal;
            margin-bottom: 35px;
        }

        p {
            font-size: 21px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .email {
            display: inline-block;
            margin-top: 15px;
            padding: 14px 30px;
            color: #f3e8d0;
            border: 1px solid #f3e8d0;
            text-decoration: none;
            font-size: 20px;
            transition: 0.3s;
        }

        .email:hover {
            background: #f3e8d0;
            color: #160f19;
        }

        .back {
            display: block;
            margin-top: 40px;
            color: #f3e8d0;
            text-decoration: none;
            font-size: 18px;
        }

        .back:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .content {
                padding: 30px 20px;
            }

            h1 {
                font-size: 38px;
            }

            p {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <div class="content">

            <h1>Get in Touch</h1>

            <p>
                For enquiries about Wajad’s writing, publications, The Mirage Shelf,
                collaborations, or other creative projects, please get in touch.
            </p>

            <a class="email"
               href="mailto:judyvamp@gmail.com">
                Email Wajad
            </a>

            <p>
                I look forward to hearing from you.
            </p>

            <a class="back" href="index.html">
                ← Back to Home
            </a>

        </div>

    </div>

</body>
</html>
